<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map · Rheon Surrogate Lab · Tuldok</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared/base.css">
<style>
  body { height: 100vh; display: grid; grid-template-rows: 48px auto 1fr; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
  .brand .mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--ink); color: var(--page); font-family: var(--mono); font-size: 13px; }
  .top h1 { font-size: 15px; font-weight: 600; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 6px 10px; border-radius: var(--radius); color: var(--ink-2); }
  .tabs a:hover { background: var(--surface-2); text-decoration: none; }
  .tabs a[aria-current="page"] { color: var(--ink); background: var(--accent-wash); }
  .top .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .strip { display: flex; align-items: center; gap: 14px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13px; }
  .strip .state { font-weight: 600; }
  .strip .msg { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .strip .needs-btn { margin-left: auto; }
  .strip .needs-btn[aria-expanded="true"] { background: var(--accent-wash); }
  #needs-panel { grid-row: 3; align-self: start; margin: 12px 20px 0; padding: 4px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); z-index: 4; position: absolute; right: 0; top: 96px; width: min(560px, calc(100vw - 40px)); }
  #needs-panel .needs li:first-child { border-top: 0; }
  .stage { position: relative; min-height: 0; overflow: hidden; display: grid; }
  main { overflow: auto; padding: 18px 20px 40px; min-height: 0; }
  main.map { padding: 10px 20px 12px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
  main.map .tree-host { overflow: auto; min-height: 0; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--surface); }
  .tree-map { height: auto; max-height: 46vh; border: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
  .tree-list .tsect { top: 0; }
  main.map > .filters { margin-bottom: 10px; }
  main.with-drawer { padding-right: calc(min(420px, 92vw) + 20px); }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); background: var(--surface); border-left: 1px solid var(--line); padding: 18px 20px 40px; overflow: auto; z-index: 3; }
  .drawer { transform: translateX(100%); visibility: hidden; }
  .drawer.open { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: no-preference) { .drawer { transition: transform .2s ease, visibility .2s; } main { transition: padding-right .2s ease; } }
  .drawer .close { position: absolute; right: 10px; top: 10px; }
  .drawer .close svg { width: 16px; height: 16px; }
  .ov-status { margin-bottom: 28px; } .ov-line { display: flex; gap: 12px; align-items: baseline; } .ov-line .state { font-size: 14px; font-weight: 600; } .ov-text { font-size: 17px; line-height: 1.4; max-width: 70ch; }
  .ov-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin: 28px 0; } .ov-stage { grid-template-columns: 110px 1fr; } .ov-study { grid-template-columns: 20px 1fr auto; }
  .ref { grid-template-columns: 1fr 140px 70px; } .ev { grid-template-columns: 1fr 1fr; } .study { grid-template-columns: 90px 1fr 110px 90px; }
  .evgrp { margin-top: 14px; } .evgrp h3 { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); }
  .evtext { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono); padding: 10px; background: var(--surface-2); border-radius: var(--radius); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; } .steps li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; } .steps .title { display: block; font-weight: 500; } .steps .sub { display: block; font-size: 12.5px; color: var(--ink-2); } .steps .todo .title { color: var(--ink-2); }
  .ins-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .annot-example { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 12px; margin-top: 18px; } .annot-example > div { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; min-height: 160px; }
  .content { max-width: none; }
  @media (max-width: 900px) { .ov-cols { grid-template-columns: 1fr; } .tabs a { padding: 6px 7px; } }
</style>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="index.html"><span class="mark">t.</span>Tuldok</a>
  <h1 id="projname"></h1>
  <nav class="tabs" aria-label="Stages" id="tabs"></nav>
  <div class="right"><div id="layouts"></div><button id="theme" class="btn sm ghost" type="button"></button></div>
</header>
<div class="strip" id="strip"></div>
<div class="stage">
  <main id="main" tabindex="-1"></main>
  <aside id="drawer" class="drawer" aria-label="Inspector" aria-hidden="true"><button class="btn sm ghost close" id="close" type="button" aria-label="Close inspector"></button><div id="aside"></div></aside>
  <div id="needs-panel" hidden></div>
</div>
<script src="shared/data.js"></script>
<script src="shared/tree.js"></script>
<script src="shared/charts.js"></script>
<script src="shared/screens.js"></script>
<script>
(() => {
  const S = window.LabScreens;
  const TABS = [['models', 'Map'], ['data', 'Data'], ['annotate', 'Annotate'], ['train', 'Train'], ['benchmarks', 'Benchmarks'], ['analysis', 'Analysis'], ['overview', 'Overview']];
  const state = { screen: 'models', sel: {}, view: 'map', kinds: null, query: '', frontierOnly: false, metric: 'worstP', table: false, zoom: 1, cmp: new Set(), pop: 'pressure', sort: { key: 'n', dir: 1 }, caseN: 1, slice: 8, fit: null, newTrain: null, planned: [], plannedSeq: 0, track: false, dataAction: {}, ui: {}, annotations: {}, draft: null };
  document.getElementById('projname').textContent = window.LAB.project.name;
  S.theme.init(document.getElementById('theme'));
  window.mockRoute = () => ({ screen: state.screen, id: state.sel[state.screen] });
  S.layoutSwitch(document.getElementById('layouts'), 'b-map.html');
  document.getElementById('close').appendChild(S.icon('x'));
  function parse() { const [screen, id] = location.hash.replace(/^#/, '').split('/'); state.screen = screen || 'models'; if (id) state.sel[state.screen] = decodeURIComponent(id); else if (screen) delete state.sel[state.screen]; }
  function go(screen, id) { const next = '#' + screen + (id ? '/' + encodeURIComponent(id) : ''); if (location.hash === next) { parse(); render(); } else location.hash = next; }
  const act = {
    go, select: id => go(state.screen, id || undefined),
    setQuery: q => { state.query = q; render(); }, setView: v => { state.view = v; render(); }, setYMode: v => { state.yMode = v; render(); }, zoom: d => { state.zoom = Math.min(1.6, Math.max(0.5, (state.zoom || 1) + d)); render(); },
    toggleKind: k => { if (!state.kinds) state.kinds = new Set([k]); else if (state.kinds.has(k)) { state.kinds.delete(k); if (!state.kinds.size) state.kinds = null; } else { state.kinds.add(k); if (state.kinds.size === S.KINDS.length) state.kinds = null; } render(); },
    toggleFrontier: () => { state.frontierOnly = !state.frontierOnly; render(); }, toggleTable: () => { state.table = !state.table; render(); }, setMetric: m => { state.metric = m; render(); },
    toggleCompare: id => { if (state.cmp.has(id)) state.cmp.delete(id); else if (state.cmp.size < 3) state.cmp.add(id); render(); }, clearCompare: () => { state.cmp = new Set(); render(); },
    setPop: v => { state.pop = v; render(); }, setSort: key => { state.sort = state.sort && state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: 1 }; render(); },
    setCase: n => { state.caseN = Math.max(1, n); render(); }, setSlice: z => { state.slice = z; render(); }, setFit: id => { state.fit = id; render(); },
    toggleTrack: () => { state.track = !state.track; render(); },
    branch: parentId => { const id = 'planned-' + (++state.plannedSeq); state.planned.push({ id, parent: parentId, kind: 'refinement', name: '', setup: { recipe: 'run-study', data: 'water-capture', runtime: 'managed-torch-cuda', attempts: 2, wall: 90, prepared: false } }); S.setPlanned(state.planned); go('models', id); },
    setPlan: (id, k, v) => { const pl = state.planned.find(x => x.id === id); if (!pl) return; if (k === 'name' || k === 'kind') pl[k] = v; else pl.setup[k] = v; S.setPlanned(state.planned); render(); },
    discardPlan: id => { const pl = state.planned.find(x => x.id === id); state.planned = state.planned.filter(x => x.id !== id); S.setPlanned(state.planned); for (const k in state.sel) if (state.sel[k] === id) delete state.sel[k]; go(state.screen === 'models' ? 'models' : 'train', state.screen === 'models' && pl ? pl.parent : undefined); render(); },
    setDataAction: (k, v) => { state.dataAction = Object.assign({}, state.dataAction || {}, { [k]: v }); render(); },
    setUI: (k, v) => { state.ui[k] = v; render(); },
    saveAnnotation: (dsId, rec, draft) => { const store = state.annotations[dsId] || (state.annotations[dsId] = {}); const prev = store[rec] || {}; store[rec] = Object.assign({}, prev, draft, { revisions: (prev.revisions || []).concat([{ at: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), label: draft.label, tags: draft.tags, review: draft.review }]) }); state.draft = null; const ds = window.LAB.project.data.find(x => x.id === dsId); state.ui['ann:rec'] = Math.min((ds ? ds.records : 1) - 1, rec + 1); render(); }
  };
  function strip() {
    const s = S.statusLine(), el = document.getElementById('strip'); el.textContent = '';
    el.appendChild(S.stateEl(s.state === 'completed' ? 'good' : 'pending', s.state === 'completed' ? 'Completed' : s.state));
    const m = document.createElement('span'); m.className = 'msg'; m.textContent = s.text + ' Updated ' + s.updated + '.'; el.appendChild(m);
    const b = document.createElement('button'); b.className = 'btn sm needs-btn'; b.type = 'button'; b.textContent = 'Needs you · ' + window.LAB.project.needs.length; b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', 'needs-panel');
    const panel = document.getElementById('needs-panel');
    b.addEventListener('click', () => { const open = panel.hidden; panel.hidden = !open; b.setAttribute('aria-expanded', String(open)); if (open) { panel.textContent = ''; const ul = document.createElement('ul'); ul.className = 'needs'; for (const n of window.LAB.project.needs) { const li = document.createElement('li'); li.className = n.kind; li.appendChild(S.icon(n.kind === 'approval' ? 'clock' : n.kind === 'changed' ? 'alert' : 'triangle')); const t = document.createElement('span'); t.textContent = n.text; li.appendChild(t); const ob = document.createElement('button'); ob.className = 'btn sm'; ob.type = 'button'; ob.textContent = n.kind === 'approval' ? 'Review' : 'Open'; ob.addEventListener('click', () => { panel.hidden = true; b.setAttribute('aria-expanded', 'false'); go(n.where, n.ref); }); li.appendChild(ob); ul.appendChild(li); } panel.appendChild(ul); } });
    el.appendChild(b);
  }
  function render() {
    const tabs = document.getElementById('tabs'); tabs.textContent = '';
    for (const [id, label] of TABS) { const a = document.createElement('a'); a.href = '#' + id; a.textContent = label; if (id === state.screen) a.setAttribute('aria-current', 'page'); tabs.appendChild(a); }
    const main = document.getElementById('main'), aside = document.getElementById('aside'), drawer = document.getElementById('drawer');
    main.className = state.screen === 'models' ? 'map' : 'content';
    const fn = S[state.screen] || S.models;
    const has = fn(main, aside, state, act, { views: ['map', 'list'], stacked: state.screen === 'models', scrollToSelected: true });
    drawer.classList.toggle('open', !!has); drawer.setAttribute('aria-hidden', String(!has)); main.classList.toggle('with-drawer', !!has);
    document.title = (TABS.find(t => t[0] === state.screen) || ['', 'Map'])[1] + ' · ' + window.LAB.project.name + ' · Tuldok';
  }
  document.getElementById('close').addEventListener('click', () => go(state.screen));
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('drawer').classList.contains('open')) go(state.screen); });
  window.addEventListener('hashchange', () => { parse(); render(); });
  { const br = new URLSearchParams(location.search).get('branch'); if (br) { const id = 'planned-' + (++state.plannedSeq); state.planned.push({ id, parent: br, kind: 'refinement', name: '', setup: { recipe: 'run-study', data: 'water-capture', runtime: 'managed-torch-cuda', attempts: 2, wall: 90, prepared: true, change: 'Try four corrections with the targeted bank' } }); S.setPlanned(state.planned); } }
  { const c = new URLSearchParams(location.search).get('cmp'); if (c) for (const id of c.split(',')) if (state.cmp.size < 3) state.cmp.add(id); }
  parse(); strip(); render();
})();
</script>
</body>
</html>
