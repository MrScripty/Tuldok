  .card .t { padding: 12px 14px 14px; }
  .card h2 { font-size: 15px; }
  .card h2 span { color: var(--ink-3); font-family: var(--mono); font-weight: 500; margin-right: 8px; }
  .card p { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>

  </div>
</div>
