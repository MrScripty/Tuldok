name: M1 workspace interface
on:
  push:
    branches: [ui/dataset-workspaces-m1-20261011]
  pull_request:
    paths:
      - 'static/workspace*'
      - 'static/pipeline-editor.js'
      - 'static/runs-view.js'
      - 'static/workbench.html'
      - 'static/index.html'
      - 'app.py'
      - 'tests/*workspace*'
      - 'tests/fixtures/workspaces/**'
      - '.github/workflows/workspaces-m1.yml'
permissions:
  contents: read
jobs:
  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_workspace_contracts.py'
      - run: node tests/browser_workspaces.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-m1-screenshots
          path: build/qa/workspaces/**
          retention-days: 14
