name: Inert extension catalog
on:
  pull_request:
    paths:
      - 'extension_contract.py'
      - 'extension_schemas/**'
      - 'requirements-extensions*'
      - 'projects.py'
      - 'app.py'
      - 'static/workspace-projects.js'
      - 'tests/*extension*'
      - 'tests/fixtures/extensions/**'
      - '.github/workflows/extensions.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tuldok_extensions
          POSTGRES_PASSWORD: isolated-ci-extensions
          POSTGRES_DB: tuldok_extensions
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tuldok_extensions -d tuldok_extensions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TULDOK_DATABASE_URL: postgresql://tuldok_extensions:isolated-ci-extensions@127.0.0.1:5432/tuldok_extensions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Provision optional validator explicitly
        run: python -m pip install --require-hashes -r requirements-extensions.lock
      - run: python -m unittest discover -s tests -p test_extensions.py -v
      - run: python -m unittest discover -s tests -p test_extension_http.py -v
      - run: python -m unittest discover -s tests -p test_projects.py -v
      - run: node --check static/workspace-projects.js
      - run: node tests/browser_workspace_extensions.cjs --scenario catalog
        env:
          BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-catalog-browser
          path: build/qa/workspace-extensions-catalog/**
          if-no-files-found: error
