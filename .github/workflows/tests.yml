name: Dataset lifecycle tests
on:
  push:
    branches: [feature/pointcloud-profile-20261009, develop/dataset-workflows, feature/grounded-text-candidates, feature/image-caption-exports, feature/selected-release-preview-20261006, feature/saved-dataset-selections-20261006, fix/saved-selection-intent-20261006, feature/explicit-metadata-filters-20261006, feature/bulk-real-import-20261006, integration/dataset-candidate-20261006, feature/annotated-caption-import-20261006, integration/dataset-caption-stage-20261006, feature/curation-diagnostics-20261006, feature/rights-note-correction-20261006, feature/instruction-responses-20261007, feature/labeled-text-import-20261007, feature/text-classification-proposals]
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --check static/workbench.js
      - run: node --check static/saved-selections.js
      - run: node --check static/saved-searches.js
      - run: node tests/test_saved_searches_controller.cjs
      - run: node --check static/curation.js
      - run: node --check static/bulk_import.js
      - run: node --check static/caption_import.js
      - run: node --check static/rights-note.js
      - run: node --check static/preferences.js
      - run: node --check static/instruction-responses.js
      - run: node --check static/grounded-instructions.js
      - run: node --check static/native_detection_import.js
      - run: node tests/test_native_detection_import_controller.cjs
      - run: node --check static/native_text_import.js
      - run: node --check static/caption-proposals.js
      - run: node --check static/text-classification-proposals.js
      - run: node --check static/pumas-model-selection.js
      - run: node tests/test_pumas_model_selection_controller.cjs
      - run: node --check static/pumas-typed.js
      - run: node tests/test_pumas_typed_controller.cjs
      - run: node --check static/pumas-owner-reuse.js
      - run: node tests/test_pumas_owner_reuse_controller.cjs
      - run: node --check static/pumas-gateways.js
      - run: node tests/test_pumas_gateways_controller.cjs
      - run: node --check static/pointclouds.js
      - run: node tests/test_pointclouds_controller.cjs
      - run: node --check static/meshes.js
      - run: node tests/test_meshes_controller.cjs
      - run: node --check static/sequence-temporal-labels.js
      - run: node tests/test_sequence_temporal_labels_controller.cjs
      - run: node --check static/sequence-review.js
      - run: node tests/test_sequence_review_controller.cjs
      - run: node --check static/sequence-probe.js
      - run: node tests/test_sequence_probe_controller.cjs
      - run: node --check static/sequences.js
