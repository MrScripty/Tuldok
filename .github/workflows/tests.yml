      - name: Verify real coordinator fault recovery and lost reply in Runs
        run: node tests/browser_workspace_coordinator.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - name: Verify real live owner phase timing workflow
        run: node tests/browser_run_phase_timings.cjs
        env:
          PYTHON: python
          BROWSER: /usr/bin/google-chrome
      - name: Qualify retained query and authenticated Runs over one actual checkpoint fixture
        run: |
          mkdir -p build/qa/retained-analysis
          python tests/retained_analysis_actual_fixture.py --directory build/retained-analysis-fixture > build/qa/retained-analysis/fixture.json
          python -m unittest discover -s tests -p 'test_retained_analysis*.py' -v > build/qa/retained-analysis/query-http-tests.log 2>&1
          node tests/test_workspace_model_controller.cjs
          node tests/browser_retained_analysis.cjs > build/qa/retained-analysis/renderer.json
          node tests/browser_retained_analysis_actual.cjs > build/qa/retained-analysis/runs-browser.json
        env:
          PYTHON: python
          BROWSER: /usr/bin/google-chrome
          TULDOK_ANALYSIS_ACTUAL: '1'
          TULDOK_ANALYSIS_HTTP: '1'
          TULDOK_ANALYSIS_FIXTURE: ${{ github.workspace }}/build/retained-analysis-fixture
      - name: Verify exact retained scientific comparison in the existing workspace
        run: node tests/browser_scientific_comparison.cjs
        env:
          PYTHON: python
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_workspace_image_run.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_text.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_audio.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_audio_run.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_mesh_run.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_sequence_run.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_spatial.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          TULDOK_NATIVE_READER_PYTHON: ${{ github.workspace }}/build/workspace-training/bin/python
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_export_run.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - run: node tests/browser_workspace_breadth.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          LD_PRELOAD: ${{ github.workspace }}/build/qa/workspace-offline.so
      - name: Qualify automatic classifier evidence and independent CPU reconstruction
        run: python tests/qualify_model_development.py --task image --fixture tests/fixtures/model_development --output build/qa/model-development-cpu
      - name: Exercise finite model development through the real browser
        run: node tests/browser_model_development.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - name: Exercise actual one-fit text model evidence in the browser
        run: node tests/browser_one_fit_model_evidence.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          TULDOK_ONE_FIT_TASK: text
      - name: Exercise actual one-fit audio model evidence in the browser
        run: node tests/browser_one_fit_model_evidence.cjs
        env:
          BROWSER: /usr/bin/google-chrome
          TULDOK_ONE_FIT_TASK: audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-qa-artifacts
          path: build/qa/**
          if-no-files-found: ignore
