name: Dataset lifecycle tests
on:
  push:
    branches: [develop/dataset-workflows, feature/grounded-text-candidates, feature/image-caption-exports]
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --check static/workbench.js
      - run: node tests/test_browser_page_load.cjs
      - run: node tests/test_workbench_controller.cjs
      - run: node tests/browser_workbench.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_grounded.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_captions.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-screenshots
          path: |
            docs/plans/dataset-workflows/reports/workbench-*.png
            docs/plans/image-caption-exports/reports/captions-*.png
          if-no-files-found: ignore
      - run: node tests/browser.cjs
        env:
          BROWSER: /usr/bin/google-chrome
