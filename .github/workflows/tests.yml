name: Dataset lifecycle tests
on:
  push:
    branches: [develop/dataset-workflows, feature/grounded-text-candidates, feature/image-caption-exports, feature/selected-release-preview-20261006, feature/saved-dataset-selections-20261006, fix/saved-selection-intent-20261006, feature/explicit-metadata-filters-20261006, feature/bulk-real-import-20261006, integration/dataset-candidate-20261006, feature/annotated-caption-import-20261006, integration/dataset-caption-stage-20261006, feature/labeled-text-import-20261007]
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --check static/workbench.js
      - run: node --check static/saved-selections.js
      - run: node --check static/bulk_import.js
      - run: node --check static/caption_import.js
      - run: node --check static/native_text_import.js
      - run: node tests/test_browser_page_load.cjs
      - run: node tests/test_workbench_controller.cjs
      - run: node tests/test_saved_selections_controller.cjs
      - run: node tests/test_saved_selection_intent.cjs
      - run: node tests/test_bulk_import_controller.cjs
      - run: node tests/test_caption_import_controller.cjs
      - run: node tests/test_native_text_import_controller.cjs
      - run: node tests/browser_workbench.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_grounded.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_captions.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_release_preview.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_saved_selections.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_saved_selection_intent.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_metadata_filters.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_bulk_import.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_dataset_integration.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_caption_import.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_caption_dataset_integration.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_native_text_import.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-screenshots
          path: |
            docs/plans/native-text-classification-import/reports/native-text-*.png
            docs/plans/dataset-workflows/reports/workbench-*.png
            docs/plans/image-caption-exports/reports/captions-*.png
            docs/plans/selected-release-preview/reports/preview-*.png
            docs/plans/saved-dataset-selections/reports/saved-*.png
            docs/plans/saved-selection-intent/reports/intent-*.png
            docs/plans/explicit-metadata-filters/reports/filters-*.png
            docs/plans/bulk-real-import/reports/bulk-*.png
            docs/plans/dataset-integration/reports/integration-*.png
            docs/plans/annotated-caption-import/reports/caption-import-*.png
            docs/plans/dataset-caption-integration/reports/caption-combined-*.png
            docs/plans/dataset-caption-integration/reports/caption-combined-session.json
          if-no-files-found: ignore
      - run: node tests/browser.cjs
        env:
          BROWSER: /usr/bin/google-chrome
      - run: node tests/browser_images.cjs
        env:
          BROWSER: /usr/bin/google-chrome
